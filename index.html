<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Belajar Kanji JLPT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        /* Sembunyikan scrollbar untuk menu level agar lebih rapi */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative">
    
    <!-- HEADER -->
    <header class="bg-green-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">Nihongo Kanji Kuis</h1>
    </header>

    <!-- LOADING SCREEN -->
    <div id="screen-loading" class="screen flex-1 p-6 flex flex-col justify-center items-center">
        <p class="font-semibold text-gray-600 animate-pulse mb-2">Memuat data CSV...</p>
        <p class="text-xs text-gray-400 text-center">Mencoba memuat N5 hingga N1 otomatis</p>
        <div id="fallbackUpload" class="hidden mt-8 p-4 border-2 border-dashed border-gray-300 rounded-lg text-center w-full">
            <p class="text-sm text-red-500 mb-3 font-semibold">Gagal memuat otomatis.</p>
            <p class="text-xs text-gray-600 mb-2">Silakan pilih semua file CSV (N5-N1):</p>
            <input type="file" id="csvFileInput" multiple accept=".csv" class="text-sm w-full">
        </div>
    </div>

    <!-- HOME / LIST HARI -->
    <div id="screen-home" class="screen hidden flex-1 flex flex-col">
        <!-- Tab Navigasi Level (Bisa di-scroll horizontal) -->
        <div class="flex overflow-x-auto border-b border-gray-200 hide-scrollbar" id="level-tabs">
            <button id="tab-N5" onclick="renderDays('N5')" class="flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 transition-colors">N5</button>
            <button id="tab-N4" onclick="renderDays('N4')" class="flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 transition-colors">N4</button>
            <button id="tab-N3" onclick="renderDays('N3')" class="flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 transition-colors">N3</button>
            <button id="tab-N2" onclick="renderDays('N2')" class="flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 transition-colors">N2</button>
            <button id="tab-N1" onclick="renderDays('N1')" class="flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 transition-colors">N1</button>
        </div>
        <div id="days-list" class="p-4 overflow-y-auto pb-20"></div>
    </div>

    <!-- MODE BELAJAR -->
    <div id="screen-belajar" class="screen hidden flex-1 flex flex-col bg-gray-50">
        <div class="flex items-center p-4 bg-white shadow-sm sticky top-0 z-10">
            <button onclick="showScreen('screen-home')" class="text-green-600 font-bold mr-4">← Back</button>
            <h2 id="belajar-title" class="text-lg font-bold">Belajar</h2>
        </div>
        <div id="belajar-list" class="p-4 overflow-y-auto"></div>
    </div>

    <!-- MODE KUIS -->
    <div id="screen-kuis" class="screen hidden flex-1 flex flex-col relative">
        <div class="flex items-center justify-between p-4 bg-white shadow-sm border-b sticky top-0 z-10">
            <button onclick="showScreen('screen-home')" class="text-gray-500 text-sm font-semibold">Akhiri Kuis</button>
            <span id="kuis-progress" class="text-sm font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full">1 / 10</span>
        </div>
        
        <div class="p-6 flex-1 flex flex-col overflow-y-auto">
            <div id="soal-container" class="bg-green-50 border border-green-200 p-6 rounded-xl text-center mb-6 shadow-sm"></div>
            <div id="opsi-container" class="grid grid-cols-1 gap-3 mb-6"></div>
            <div id="penjelasan-container" class="hidden bg-gray-50 border border-gray-200 p-4 rounded-lg mb-6">
                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Penjelasan:</h4>
                <p id="penjelasan-furigana" class="text-sm font-bold text-green-700 mb-2"></p>
                <div id="penjelasan-contoh" class="mt-3 text-sm"></div>
                <button onclick="soalSelanjutnya()" class="mt-5 w-full bg-green-600 text-white font-bold py-3 rounded-lg shadow hover:bg-green-700 transition">Lanjut →</button>
            </div>
        </div>
    </div>

    <!-- MODAL PENGATURAN KUIS -->
    <div id="modal-pengaturan" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative">
            <h3 class="text-xl font-bold text-gray-800 mb-5 border-b pb-3" id="modal-title">Pengaturan Kuis</h3>
            
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">Mode Kuis</label>
                <select id="setting-mode" class="w-full border-2 border-gray-200 rounded-xl p-3 text-sm focus:border-green-500 focus:outline-none font-medium text-gray-700">
                    <option value="campur">🔀 Campur (Acak Skenario)</option>
                    <option value="tebak_arti">🇯🇵 Tebak Arti (Kanji → Arti)</option>
                    <option value="tebak_kanji">🇮🇩 Tebak Kanji (Arti → Kanji)</option>
                </select>
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-700 mb-2">Jumlah Soal</label>
                <select id="setting-jumlah" class="w-full border-2 border-gray-200 rounded-xl p-3 text-sm focus:border-green-500 focus:outline-none font-medium text-gray-700">
                    <option value="semua" id="opt-semua">Semua Soal</option>
                    <!-- <option value="10">10 Soal (Try Out Mini)</option>
                    <option value="20">20 Soal</option>
                    <option value="50">50 Soal (Simulasi JLPT)</option> -->
                </select>
            </div>

            <div class="flex gap-3">
                <button onclick="tutupPengaturan()" class="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl text-sm font-bold hover:bg-gray-200 transition">Batal</button>
                <button onclick="mulaiKuisSekarang()" class="flex-1 py-3 bg-green-600 text-white rounded-xl text-sm font-bold hover:bg-green-700 shadow-md transition">Mulai Tes</button>
            </div>
        </div>
    </div>

</div>

<script>
    const levelsList = ['N5', 'N4', 'N3', 'N2', 'N1'];
    const kanjiData = { 'N5': {}, 'N4': {}, 'N3': {}, 'N2': {}, 'N1': {} };
    let currentLevel = 'N5';
    let currentDay = ''; // 'ALL' jika memilih semua hari
    
    // State Kuis & Pengaturan
    let pendingDayKey = '';
    let quizSettings = { mode: 'campur', jumlah: 'semua' };
    let quizData = [];
    let currentQIndex = 0;
    let correctAnswer = null;
    let isAnswered = false;

    // Inisialisasi: Coba memuat kelima file CSV secara otomatis
    window.onload = () => {
        let fetchPromises = levelsList.map(lvl => 
            fetch(`Kanji_untuk_JLPT_${lvl}_export.csv`)
                .then(res => {
                    if(!res.ok) throw new Error(); 
                    return res.text();
                })
                .then(text => processCSV(lvl, text))
                .catch(err => {
                    console.log(`File ${lvl} tidak ditemukan secara otomatis.`);
                })
        );

        Promise.all(fetchPromises).then(() => {
            // Cek apakah ada setidaknya satu data level yang terisi
            const isAnyDataLoaded = levelsList.some(lvl => Object.keys(kanjiData[lvl]).length > 0);
            
            if(isAnyDataLoaded) {
                showScreen('screen-home');
                renderDays('N5');
            } else {
                document.getElementById('fallbackUpload').classList.remove('hidden');
            }
        });
    };

    // Manual Upload jika fetch otomatis gagal
    document.getElementById('csvFileInput').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        let loaded = 0;
        files.forEach(file => {
            const levelMatch = file.name.match(/N(5|4|3|2|1)/i);
            const level = levelMatch ? `N${levelMatch[1]}` : 'N5';
            Papa.parse(file, {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    processCSV(level, null, results.data);
                    loaded++;
                    if(loaded === files.length) {
                        showScreen('screen-home');
                        renderDays('N5');
                    }
                }
            });
        });
    });

    function processCSV(level, csvText, rawData = null) {
        let parseResult = rawData || Papa.parse(csvText, { header: true, skipEmptyLines: true }).data;
        parseResult.forEach((row, index) => {
            let dayNum = Math.floor(index / 10) + 1;
            let dayKey = 'hari_' + dayNum;
            if(!kanjiData[level][dayKey]) kanjiData[level][dayKey] = [];
            
            let contoh = [];
            ['Kata 1', 'Kata 2', 'Kata 3'].forEach(col => {
                if(row[col] && row[col].trim() !== '') {
                    let match = row[col].trim().match(/^(.*?)【(.*?)】(.*)$/);
                    if(match) contoh.push({ kalimat: match[1].trim(), furigana: match[2].trim(), arti: match[3].trim() });
                    else contoh.push({ kalimat: row[col].trim(), furigana: "-", arti: "-" });
                }
            });
            
            kanjiData[level][dayKey].push({
                id: `${level}_${index}`, // ID Unik lintas level
                kanji: row['Kanji'],
                furigana: `Kun: ${row['Kun'] || '-'} / On: ${row['On'] || '-'}`,
                arti: row['Arti'],
                contoh: contoh
            });
        });
    }

    // Fungsi utilitas untuk mengambil data 1 hari atau semua hari
    function getKanjiList(level, dayKey) {
        if (dayKey === 'ALL') {
            return Object.values(kanjiData[level]).flat();
        }
        return kanjiData[level][dayKey] || [];
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function renderDays(level) {
        currentLevel = level;
        
        // Render styling tab
        levelsList.forEach(lvl => {
            const btn = document.getElementById(`tab-${lvl}`);
            if(lvl === level) {
                btn.className = "flex-shrink-0 w-1/4 py-3 text-sm font-bold text-green-600 border-b-2 border-green-600 bg-green-50/50 transition-colors";
            } else {
                btn.className = "flex-shrink-0 w-1/4 py-3 text-sm font-bold text-gray-400 hover:text-green-500 transition-colors";
            }
        });
        
        const container = document.getElementById('days-list');
        container.innerHTML = '';

        if(Object.keys(kanjiData[level]).length === 0) {
            container.innerHTML = `<p class="text-center py-10 text-gray-500 text-sm">Data ${level} belum dimuat atau tidak tersedia.</p>`;
            return;
        }

        // --- KARTU "SEMUA HARI" ---
        let totalSemua = getKanjiList(level, 'ALL').length;
        container.innerHTML += `
            <div class="flex flex-col mb-8 p-5 bg-gradient-to-br from-green-600 to-green-500 rounded-2xl shadow-md text-white">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Semua Kosakata ${level}</h3>
                    <span class="bg-white/20 text-xs px-2 py-1 rounded-md font-bold">${totalSemua} Kanji</span>
                </div>
                <div class="flex gap-3">
                    <button onclick="startBelajar('ALL')" class="flex-1 py-2.5 bg-white text-green-700 rounded-xl text-sm font-bold shadow-sm hover:bg-gray-100 transition">Lihat Semua</button>
                    <button onclick="bukaPengaturanKuis('ALL')" class="flex-1 py-2.5 bg-green-800 text-white rounded-xl text-sm font-bold shadow-sm hover:bg-green-900 transition">Kuis Semua</button>
                </div>
            </div>
        `;

        // --- KARTU PER HARI ---
        Object.keys(kanjiData[level]).forEach(dayKey => {
            let total = kanjiData[level][dayKey].length;
            let dayNum = dayKey.replace('hari_', '');
            
            container.innerHTML += `
                <div class="flex flex-col mb-4 p-4 bg-white rounded-xl shadow-[0_2px_8px_-3px_rgba(0,0,0,0.1)] border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800 text-base">Hari Ke-${dayNum}</h3>
                        <span class="bg-gray-100 text-gray-600 text-[10px] uppercase tracking-wider px-2 py-1 rounded-md font-bold">${total} Kanji</span>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="startBelajar('${dayKey}')" class="flex-1 py-2 bg-green-50 text-green-700 border border-green-200 rounded-lg text-sm font-bold hover:bg-green-100 transition">Lihat</button>
                        <button onclick="bukaPengaturanKuis('${dayKey}')" class="flex-1 py-2 bg-green-600 text-white rounded-lg text-sm font-bold hover:bg-green-700 shadow-sm transition">Kuis</button>
                    </div>
                </div>
            `;
        });
    }

    function startBelajar(dayKey) {
        currentDay = dayKey;
        let titleSuffix = dayKey === 'ALL' ? 'Semua Hari' : `Hari ${dayKey.replace('hari_', '')}`;
        document.getElementById('belajar-title').innerText = `${currentLevel} - ${titleSuffix}`;
        
        const container = document.getElementById('belajar-list');
        container.innerHTML = '';

        let listKanji = getKanjiList(currentLevel, dayKey);

        listKanji.forEach((item, index) => {
            let contohHtml = item.contoh.map(c => `
                <div class="mt-3 pl-3 border-l-2 border-green-400">
                    <p class="text-sm font-bold text-gray-800">${c.kalimat}</p>
                    <p class="text-[11px] text-gray-500 font-medium">${c.furigana}</p>
                    <p class="text-xs text-gray-600 italic mt-0.5">${c.arti}</p>
                </div>
            `).join('');

            // Lazy rendering trick (agar kalau load ALL tidak lag, walau 800 node HTML)
            container.innerHTML += `
                <details class="bg-white rounded-xl shadow-sm mb-3 border border-gray-200 overflow-hidden group">
                    <summary class="flex items-center justify-between p-4 cursor-pointer hover:bg-gray-50 transition">
                        <div class="flex items-center gap-5">
                            <span class="text-xs font-bold text-gray-400 w-4">${index + 1}.</span>
                            <span class="text-3xl font-extrabold text-green-700 min-w-[40px] text-center">${item.kanji}</span>
                            <span class="text-sm font-semibold text-gray-700 leading-snug">${item.arti}</span>
                        </div>
                        <span class="text-gray-300 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div class="p-5 bg-green-50/30 border-t border-gray-100">
                        <p class="text-xs font-bold text-green-700 mb-4 bg-green-100 inline-block px-2 py-1 rounded">${item.furigana}</p>
                        ${contohHtml ? `<h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Contoh Kalimat:</h4>${contohHtml}` : ''}
                    </div>
                </details>
            `;
        });
        showScreen('screen-belajar');
    }

    function bukaPengaturanKuis(dayKey) {
        pendingDayKey = dayKey;
        let titleSuffix = dayKey === 'ALL' ? 'Semua Hari' : `Hari ${dayKey.replace('hari_', '')}`;
        document.getElementById('modal-title').innerText = `Kuis ${currentLevel} - ${titleSuffix}`;
        document.getElementById('modal-pengaturan').classList.remove('hidden');
    }

    function tutupPengaturan() {
        document.getElementById('modal-pengaturan').classList.add('hidden');
    }

    function mulaiKuisSekarang() {
        quizSettings.mode = document.getElementById('setting-mode').value;
        quizSettings.jumlah = document.getElementById('setting-jumlah').value;
        tutupPengaturan();
        
        currentDay = pendingDayKey;
        
        // Ambil data (1 hari spesifik, atau semua hari)
        let allQuestions = getKanjiList(currentLevel, currentDay);
        quizData = acakArray([...allQuestions]); // clone and shuffle
        
        // Terapkan batasan jumlah soal
        if (quizSettings.jumlah !== 'semua') {
            let limit = parseInt(quizSettings.jumlah);
            if(limit < quizData.length) {
                quizData = quizData.slice(0, limit);
            }
        }
        
        currentQIndex = 0;
        showScreen('screen-kuis');
        renderSoal();
    }

    function acakArray(arr) {
        return arr.sort(() => Math.random() - 0.5);
    }

    function renderSoal() {
        isAnswered = false;
        document.getElementById('penjelasan-container').classList.add('hidden');
        document.getElementById('kuis-progress').innerText = `${currentQIndex + 1} / ${quizData.length}`;
        
        let item = quizData[currentQIndex];
        correctAnswer = item;
        let randomContoh = item.contoh.length > 0 ? acakArray([...item.contoh])[0] : null;

        let isCase1;
        if (quizSettings.mode === 'tebak_arti') isCase1 = true;
        else if (quizSettings.mode === 'tebak_kanji') isCase1 = false;
        else isCase1 = Math.random() > 0.5;

        const soalBox = document.getElementById('soal-container');
        if (isCase1) {
            soalBox.innerHTML = `
                <div class="text-6xl font-black text-green-700 mb-4">${item.kanji}</div>
                ${randomContoh ? `<div class="text-sm text-gray-700 font-semibold bg-white px-3 py-2 rounded-lg inline-block border shadow-sm">${randomContoh.kalimat}</div>` : ''}
            `;
        } else {
            soalBox.innerHTML = `<div class="text-2xl font-bold text-gray-800">${item.arti}</div>`;
        }

        // Ambil seluruh kata di Level & Hari tsb untuk mencari pengecoh (jawaban salah)
        let allPool = getKanjiList(currentLevel, currentDay);
        let wrongOptions = acakArray(allPool.filter(k => k.id !== item.id)).slice(0, 3);
        
        let options = acakArray([item, ...wrongOptions]);
        const opsiBox = document.getElementById('opsi-container');
        opsiBox.innerHTML = '';
        
        const labels = ['A', 'B', 'C', 'D'];
        options.forEach((opt, idx) => {
            let textOpsi = isCase1 ? opt.arti : opt.kanji;
            let textClass = isCase1 ? 'text-sm' : 'text-xl font-bold';
            opsiBox.innerHTML += `
                <button onclick="cekJawaban(this, '${opt.id}', ${isCase1})" class="opsi-btn w-full text-left bg-white border-2 border-gray-100 p-4 rounded-xl flex items-center hover:border-green-300 hover:bg-green-50 transition-all">
                    <span class="bg-gray-100 text-gray-500 font-bold w-10 h-10 rounded-full flex items-center justify-center mr-4 flex-shrink-0">${labels[idx]}</span>
                    <span class="flex-1 text-gray-800 font-medium ${textClass}">${textOpsi}</span>
                </button>
            `;
        });
    }

    function cekJawaban(btn, idJawab, isCase1) {
        if (isAnswered) return;
        isAnswered = true;

        let btns = document.querySelectorAll('.opsi-btn');
        let idBenar = correctAnswer.id.toString();

        btns.forEach(b => {
            b.classList.remove('hover:border-green-300', 'hover:bg-green-50');
            b.classList.add('cursor-default');
            
            let btnActionId = b.getAttribute('onclick').match(/'(.*?)'/)[1]; // Ambil string id (bisa "N5_1", dll)
            
            if (btnActionId === idBenar) {
                b.classList.add('bg-green-50', 'border-green-500');
                b.children[0].classList.add('bg-green-500', 'text-white');
                b.children[0].classList.remove('bg-gray-100', 'text-gray-500');
            } else if (btnActionId === idJawab && idJawab !== idBenar) {
                b.classList.add('bg-red-50', 'border-red-400');
                b.children[0].classList.add('bg-red-500', 'text-white');
                b.children[0].classList.remove('bg-gray-100', 'text-gray-500');
            } else {
                b.classList.add('opacity-50');
            }
        });

        tampilkanPenjelasan();
    }

    function tampilkanPenjelasan() {
        const wadahPenjelasan = document.getElementById('penjelasan-container');
        wadahPenjelasan.classList.remove('hidden');
        
        document.getElementById('penjelasan-furigana').innerText = `${correctAnswer.kanji} - ${correctAnswer.furigana} - ${correctAnswer.arti}`;
        
        let contohHtml = correctAnswer.contoh.map(c => `
            <div class="mb-3 pb-3 border-b border-gray-200 last:border-0 last:mb-0 last:pb-0">
                <p class="font-bold text-gray-800">${c.kalimat}</p>
                <p class="text-[11px] text-gray-500 font-medium">${c.furigana}</p>
                <p class="text-xs text-gray-600 italic mt-0.5">${c.arti}</p>
            </div>
        `).join('');
        
        document.getElementById('penjelasan-contoh').innerHTML = contohHtml || '<p class="text-xs text-gray-500">Tidak ada contoh kalimat.</p>';
        
        setTimeout(() => {
            wadahPenjelasan.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }, 150);
    }

    function soalSelanjutnya() {
        currentQIndex++;
        if (currentQIndex < quizData.length) {
            renderSoal();
        } else {
            alert('🎉 Selamat! Kamu telah menyelesaikan kuis ini!');
            showScreen('screen-home');
        }
    }
</script>

</body>
</html>
