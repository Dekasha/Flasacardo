<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flasacardo - Kelola Deck & Belajar</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { arema: '#0032A0', aremaDark: '#002277' } }
            }
        }
    </script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .is-flipped { transform: rotateY(180deg); }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans antialiased">

    <!-- Header -->
    <header class="bg-arema text-white text-center py-6 shadow-md">
        <h1 class="text-3xl font-extrabold tracking-wide">🦁 Flasacardo</h1>
        <p class="text-sm mt-2 opacity-90">Satu Jiwa, Pantang Lupa!</p>
    </header>

    <main class="max-w-4xl mx-auto mt-8 mb-12 p-6 bg-white rounded-2xl shadow-lg relative">
        
        <!-- ========================================== -->
        <!-- VIEW 1: DASHBOARD (PILIH & BUAT DECK)      -->
        <!-- ========================================== -->
        <section id="view-dashboard" class="block">
            <h2 class="text-2xl font-bold text-arema mb-6 border-b pb-2">📚 Daftar Deck Kamu</h2>
            
            <!-- Grid untuk daftar deck -->
            <div id="deck-list" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <p class="text-gray-500 italic">Memuat deck...</p>
            </div>

            <!-- Form Buat Deck / Sub Deck Baru -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <h3 class="font-bold text-arema mb-2">+ Buat Deck & Sub-Deck Baru</h3>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="inputNamaDeckBaru" placeholder="Deck Utama (Misal: B. Inggris)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-arema">
                    <input type="text" id="inputSubDeckBaru" placeholder="Sub-Deck (Misal: Bab 1)" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-arema">
                    <button id="btnBuatDeck" class="bg-arema hover:bg-aremaDark text-white font-bold py-2 px-6 rounded-lg transition whitespace-nowrap">Buat</button>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- VIEW 2: MODE BELAJAR (FLASHCARD)           -->
        <!-- ========================================== -->
        <section id="view-belajar" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b pb-2">
                <h2 id="judulBelajar" class="text-xl font-bold text-arema">Belajar: -</h2>
                <button id="btnKembaliBelajar" class="text-sm bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg font-bold">🔙 Kembali</button>
            </div>
            
            <div class="max-w-xl mx-auto text-center mb-8">
                <p id="progressBelajar" class="text-sm text-gray-500 mb-2 font-bold">Kartu 1 / 10</p>
                
                <div class="perspective-1000 w-full h-64 mb-6 cursor-pointer" id="flashcard">
                    <div class="relative w-full h-full duration-700 transform-3d transition-transform" id="card-inner">
                        <div class="absolute inset-0 backface-hidden border-2 border-arema bg-white rounded-xl shadow-md flex flex-col items-center justify-center p-6">
                            <h2 id="teksSoal" class="text-xl font-bold text-gray-700">Soal</h2>
                            <img id="gambarSoal" src="" alt="Gambar Soal" class="mt-4 max-h-28 rounded-md hidden">
                        </div>
                        <div class="absolute inset-0 backface-hidden rotate-y-180 bg-arema text-white rounded-xl shadow-md flex items-center justify-center p-6">
                            <h2 id="teksJawaban" class="text-2xl font-bold text-center overflow-y-auto">Jawaban</h2>
                        </div>
                    </div>
                </div>

                <div class="flex justify-center gap-4">
                    <button id="btnBalik" class="bg-arema hover:bg-aremaDark text-white font-bold py-2 px-6 rounded-lg transition shadow">Balik Kartu</button>
                    <button id="btnLanjut" class="border-2 border-arema text-arema hover:bg-arema hover:text-white font-bold py-2 px-6 rounded-lg transition">Berikutnya ➔</button>
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- VIEW 3: MODE KELOLA (CRUD & BULK INSERT)   -->
        <!-- ========================================== -->
        <section id="view-kelola" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b pb-2">
                <h2 id="judulKelola" class="text-xl font-bold text-arema">Kelola: -</h2>
                <button id="btnKembaliKelola" class="text-sm bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg font-bold">🔙 Kembali</button>
            </div>

            <div class="bg-gray-50 p-4 rounded-lg border mb-8">
                <div class="flex gap-4 mb-4 border-b pb-2">
                    <button id="tabSingle" class="font-bold text-arema border-b-2 border-arema">Tambah 1 Kartu</button>
                    <button id="tabBulk" class="font-bold text-gray-400 hover:text-arema">Bulk Insert</button>
                </div>

                <!-- Form Single -->
                <div id="formSingle" class="block space-y-3">
                    <input type="text" id="inputSoal" placeholder="Pertanyaan..." class="w-full px-4 py-2 border rounded-lg">
                    <input type="text" id="inputJawaban" placeholder="Jawaban..." class="w-full px-4 py-2 border rounded-lg">
                    <input type="file" id="inputGambar" accept="image/*" class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                    <button id="btnSimpanSingle" class="w-full bg-arema text-white font-bold py-2 px-4 rounded-lg">Simpan Kartu</button>
                    <p id="statusUpload" class="text-sm text-center font-medium"></p>
                </div>

                <!-- Form Bulk -->
                <div id="formBulk" class="hidden space-y-3">
                    <p class="text-xs text-gray-500">Format: <b>Soal | Jawaban</b>, tekan Enter untuk baris baru.</p>
                    <textarea id="inputBulk" rows="5" class="w-full px-4 py-2 border rounded-lg font-mono text-sm" placeholder="Ibukota Indonesia | Nusantara&#10;1+1 | 2"></textarea>
                    <button id="btnSimpanBulk" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Simpan Banyak Kartu Sekaligus</button>
                    <p id="statusBulk" class="text-sm text-center font-medium"></p>
                </div>
            </div>

            <h3 class="font-bold text-lg mb-2">Daftar Kartu:</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-2 px-4 border-b text-left text-sm">Soal</th>
                            <th class="py-2 px-4 border-b text-left text-sm">Jawaban</th>
                            <th class="py-2 px-4 border-b text-left text-sm">Gambar</th>
                            <th class="py-2 px-4 border-b text-center text-sm">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelKartuBody"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- MODAL EDIT -->
    <div id="modalEdit" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-bold text-arema mb-4">Edit Kartu</h3>
            <input type="hidden" id="editIdKartu">
            <input type="hidden" id="editUrlLama">
            
            <div class="space-y-3">
                <input type="text" id="editSoal" class="w-full px-4 py-2 border rounded-lg">
                <input type="text" id="editJawaban" class="w-full px-4 py-2 border rounded-lg">
                
                <label class="block text-xs text-gray-500">Ganti Gambar (Opsional):</label>
                <input type="file" id="editGambarBaru" accept="image/*" class="w-full px-3 py-2 border rounded-lg text-sm">
                
                <div class="flex items-center gap-2 mt-2 bg-red-50 p-2 rounded-lg border border-red-100 hidden" id="areaHapusGambar">
                    <input type="checkbox" id="centangHapusGambar" class="w-4 h-4 text-red-600 rounded">
                    <label for="centangHapusGambar" class="text-sm text-red-600 font-bold">Hapus gambar dari kartu ini</label>
                </div>
                
                <div class="flex gap-2 mt-4">
                    <button id="btnBatalEdit" class="w-1/2 bg-gray-300 hover:bg-gray-400 font-bold py-2 rounded-lg">Batal</button>
                    <button id="btnSimpanEdit" class="w-1/2 bg-arema hover:bg-aremaDark text-white font-bold py-2 rounded-lg">Update Data</button>
                </div>
                <p id="statusEdit" class="text-sm text-center mt-2"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
